# Codacy configuration.
#
# `exclude_paths` is additive to Codacy's default ignores and does not change
# which analysis tools are enabled — it only tells Codacy to skip these files.
exclude_paths:
  # Vendored verbatim from the fastlane project
  # (https://github.com/fastlane/fastlane) and updated by re-copying, not by
  # hand. We do not restyle it to local lint rules.
  - "standalone/webapp/ios/App/AppStoreScreenshots/SnapshotHelper.swift"

  # The JetBrains plugin bundles its webview as a pre-built, minified Vite
  # output committed to the repo (IntelliJ plugins have no build-time step
  # to run it themselves) — same reasoning as the VS Code extension's own
  # webview bundle. Not hand-authored, not restyled to local lint rules.
  - "jetbrains-plugin/src/main/resources/webview/**"
