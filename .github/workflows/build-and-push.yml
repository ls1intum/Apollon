name: Build and Push Docker Image

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docker-relevant: ${{ steps.filter.outputs.docker-relevant }}
      should-skip: ${{ steps.skip-check.outcome == 'success' && steps.skip-check.outputs.should_skip == 'true' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - id: skip-check
        # Deduplication is optional; an API failure must run normal checks.
        continue-on-error: true
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5
        with:
          # Never skip push-to-main — always need fresh images after merge
          do_not_skip: '["push", "workflow_dispatch"]'

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        if: steps.skip-check.outcome != 'success' || steps.skip-check.outputs.should_skip != 'true'
        with:
          filters: |
            docker-relevant:
              - 'library/**'
              - 'standalone/**'
              - 'docker/**'
              - 'nginx.conf'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.nvmrc'
              - 'tsconfig*.json'
              - '.github/workflows/build-and-push.yml'

  build-and-push-workflow:
    name: ${{ matrix.name }}
    needs: [detect-changes]
    if: >
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.detect-changes.outputs.should-skip != 'true' && (
        needs.detect-changes.outputs.docker-relevant == 'true' ||
        github.event_name == 'push'
      )
    strategy:
      fail-fast: false
      matrix:
        # image must be bare (no registry prefix) — the reusable workflow below prepends it.
        include:
          - name: Webapp
            dockerfile: ./standalone/webapp/Dockerfile
            image: ls1intum/apollon/webapp
            context: .
          - name: Server
            dockerfile: ./standalone/server/Dockerfile
            image: ls1intum/apollon/server
            context: .
    uses: ls1intum/.github/.github/workflows/build-and-push-docker-image.yml@5f645f96873d8b8b3a9b2e52d06626c71377f7ac # main
    with:
      image-name: ${{ matrix.image }}
      docker-file: ${{ matrix.dockerfile }}
      docker-context: ${{ matrix.context }}
      tags: "type=sha,format=long"

  fork-build:
    name: Fork / Build ${{ matrix.platform }} Docker Image for ${{ matrix.image }}
    needs: [detect-changes]
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      needs.detect-changes.outputs.should-skip != 'true' &&
      needs.detect-changes.outputs.docker-relevant == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [webapp, server]
        platform: [linux/amd64, linux/arm64]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./standalone/${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false

  # Gate job for required checks — handles skipped builds correctly
  docker-build-gate:
    name: Docker Build Gate
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push-workflow, fork-build]
    if: ${{ !cancelled() }}
    steps:
      - name: Evaluate results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "Docker build failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Docker build was cancelled"
            exit 1
          fi
          echo "Docker build passed or was skipped"
