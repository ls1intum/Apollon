# Documentation Deployment Pipeline
#
# - PR with docs changes: build a /-rooted bundle
# - production builds deploy only when their pinned npm version is public
# - library release completion checks whether npm approval permits deployment

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "library/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/workflows/docs.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/**"
      - "library/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  workflow_run:
    workflows: [Release Library]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docusaurus site
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      is-production: ${{ steps.flag.outputs.is-production }}
      published: ${{ steps.npm.outputs.published }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - id: flag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" != "pull_request" ]]; then
            echo "is-production=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-production=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that production CDN links are published
        id: npm
        if: steps.flag.outputs.is-production == 'true'
        run: |
          npm view --registry=https://registry.npmjs.org/ --json @tumaet/apollon versions > published-versions.json
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs'
          const { version } = JSON.parse(readFileSync('library/package.json', 'utf8'))
          const versions = JSON.parse(readFileSync('published-versions.json', 'utf8'))
          if (!Array.isArray(versions)) throw new Error('Invalid npm version list')
          const published = versions.includes(version)
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${published}\n`)
          if (!published) console.log('Docs deployment waits for npm approval.')
          NODE

      - run: pnpm install --frozen-lockfile

      # Library must be built first — the docs site imports
      # `@tumaet/apollon` for the live embed on the homepage.
      - run: pnpm --filter @tumaet/apollon run build

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            docs/.docusaurus
            docs/node_modules/.cache
          key: docusaurus-${{ steps.flag.outputs.is-production }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('docs/**/*.{md,mdx,ts,tsx}') }}
          restore-keys: |
            docusaurus-${{ steps.flag.outputs.is-production }}-${{ hashFiles('pnpm-lock.yaml') }}-
            docusaurus-${{ steps.flag.outputs.is-production }}-

      - run: pnpm --filter @tumaet/docs run build
        env:
          DOCUSAURUS_BASE_URL: ${{ steps.flag.outputs.is-production == 'true' && '/Apollon/' || '/' }}

      - if: steps.flag.outputs.is-production == 'true' && steps.npm.outputs.published == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.is-production == 'true' && needs.build.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
