name: Release

# Versioning creates a PR; publication is owned by the release workflows.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: Version Packages PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: version-pr
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create or update the Version Packages PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ github.token }}
          version-script: pnpm run changeset:version
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          create-github-releases: false
          push-git-tags: false
          push-with-git-cli: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
