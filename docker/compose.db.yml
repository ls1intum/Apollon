services:
  db:
    # The bundle image is required: the server's boot gate refuses to start
    # without a JSON module, and plain `valkey/valkey` (or `redis:*-alpine`)
    # ships without one. valkey-bundle's entrypoint auto-loads every module in
    # /usr/lib/valkey (json, search, bf, ldap) when the command starts with
    # `valkey-server`, so no --loadmodule flags are needed. The service name
    # stays `db` (REDIS_URL=redis://db:6379 is unchanged).
    image: valkey/valkey-bundle:9.2.0-alpine@sha256:005117314f1af146684ecf55ac3d0553135917048b2572f8d0c34e41007b6cb0
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      # New volume name on purpose: the old `dbdata` volume holds Redis Stack
      # RDB/AOF files (RDB format 12) that Valkey cannot load, and keeping it
      # untouched is the rollback path. Data is moved with the logical copy in
      # ops/valkey-migration.md, not by reusing files.
      - valkeydata:/data
    networks:
      - apollon-network
    command:
      - valkey-server
      # The image's working directory is already /data; pinned explicitly so a
      # future image change cannot silently move the AOF/RDB out of the volume.
      - --dir
      - /data
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  valkeydata:

networks:
  apollon-network:
    name: apollon-network
    external: true
