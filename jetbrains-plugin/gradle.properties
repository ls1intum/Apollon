# The IntelliJ Platform supplies the Kotlin stdlib at runtime; bundling a
# second copy into the plugin ZIP causes classloader conflicts and is flagged
# by `verifyPluginProjectConfiguration`.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.parallel=true
# Gradle 9's configuration-cache defaults are still moving, and the IntelliJ
# Platform Gradle Plugin's own CC support is not something to debug in a
# scaffold PR. Pinned off explicitly rather than left to whatever the default
# happens to be this Gradle release.
org.gradle.configuration-cache=false
