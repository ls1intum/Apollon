# The JVM-side analogue of `pnpm-workspace.yaml`'s `catalog:` — every pinned
# version for this workspace's Gradle build lives here, not scattered across
# build.gradle.kts. Versions verified against plugins.jetbrains.com/docs/intellij
# and the IntelliJ Platform Gradle Plugin's own sources at pin time (2026-09);
# re-check upstream before bumping.
#
# The Kotlin/Java pins below are NOT "use the newest of everything" — they thread
# a specific compatibility triangle:
#   - IntelliJ Platform Gradle Plugin 2.x's own stated floor is Gradle >= 9.0.0
#     and Java Runtime >= 17 (the 8.13 floor some older migration guides quote
#     applied to earlier 2.x releases, not the pinned 2.18.1).
#   - `intellijIdeaCommunity(...)` is only published for platform versions
#     < 2025.3 (build 253) — 2025.2 (build 252) is the newest branch where it
#     still resolves, which is why that's the compile-time floor below. Compile
#     against the floor; the Plugin Verifier (Phase 6 CI) checks newer IDEs.
#   - IntelliJ Platform 252 requires Java 21 at runtime.
#   - The Kotlin *compiler* must support Gradle 9.7 (needs >= 2.2), but the
#     *emitted* language/API level must not exceed the stdlib IntelliJ 252
#     actually bundles (2.1.20) when `kotlin.stdlib.default.dependency=false`
#     opts out of shipping our own copy. Hence: newest compiler, capped emit.
[versions]
kotlin = "2.4.20"
kotlinApi = "2.1"
javaTarget = "21"
intellijPlatform = "2.18.1"
intellijIdeaCommunity = "2025.2"
junit = "4.13.2"
# Bundled by our plugin rather than assumed from the platform classpath: the
# platform's own copy (if any) is an implementation detail of unrelated
# JetBrains code, not a contract we can compile against. Kotlin plugin
# classloaders are isolated per-plugin, so bundling our own risks no conflict.
kotlinxSerializationJson = "1.11.0"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellijPlatform" }
